[project]
name = "medibot"
version = "0.2.0"
description = "RAG-based Clinical Reference Assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "faiss-cpu>=1.7",
    "groq>=0.29",
    "langchain>=0.3,<1.0",
    "langchain-community>=0.3,<1.0",
    "langchain-groq>=0.3,<1.0",
    "langchain-huggingface>=0.3,<1.0",
    "pypdf>=5.0",
    "python-dotenv>=1.0",
    "sentence-transformers>=3.0",
    "streamlit>=1.40",
    "markdown>=3.10",
    "google-genai>=1.0",
    "langchain-google-genai>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sse-starlette>=2.1",
    "sqlalchemy>=2.0",
]

[project.scripts]
medibot = "medibot.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medibot"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
